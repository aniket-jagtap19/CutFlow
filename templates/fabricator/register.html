<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CutFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Reusing identical CSS to login page */
:root { --ink: #0D1B2A; --gold: #C9922A; --gold2: #E8B04B; --white: #FFFFFF; --fog: #A0AEC0; --trans: all .25s ease; }
body { font-family: 'Inter', sans-serif; background: var(--ink); color: var(--white); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
body::before { content: ''; position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(201,146,42,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(201,146,42,.06) 1px, transparent 1px); background-size: 48px 48px; pointer-events: none; }
.auth-panel { position: relative; z-index: 1; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 12px; backdrop-filter: blur(8px); width: 100%; max-width: 400px; padding: 40px; }
.logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--gold), var(--gold2)); border-radius: 10px; display: grid; place-items: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; color: var(--ink); margin: 0 auto 20px; }
h2 { font-family: 'Syne', sans-serif; text-align: center; margin-bottom: 30px; }
.form-group { margin-bottom: 15px; }
label { display: block; font-size: 11px; color: var(--fog); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
input { width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; color: var(--white); padding: 12px; box-sizing: border-box; outline: none; transition: var(--trans); }
input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,146,42,.12); }
.btn-gold { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--gold), var(--gold2)); border: none; border-radius: 8px; color: var(--ink); font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; transition: var(--trans); margin-top: 15px; }
.btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,146,42,.35); }
.footer-text { text-align: center; margin-top: 20px; font-size: 12px; color: var(--fog); }
.footer-text a { color: var(--gold); text-decoration: none; font-weight: 500; }
.error-msg { color: #E53E3E; font-size: 12px; text-align: center; margin-bottom: 15px; display: none; }
</style>
</head>
<body>

<div class="auth-panel">
    <div class="logo-icon">🪚</div>
    <h2>Create Account</h2>
    
    <div class="error-msg" id="errorMsg"></div>

    <form id="registerForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required minlength="6">
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" required minlength="6">
        </div>
        <button type="submit" class="btn-gold" id="submitBtn">Create Account</button>
    </form>

    <div class="footer-text">
        Already have an account? <a href="/login/">Sign in</a>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords do not match!";
        errorMsg.style.display = 'block';
        return;
    }

    btn.textContent = 'Creating...';
    btn.disabled = true;
    errorMsg.style.display = 'none';

    try {
        const response = await fetch('/api/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        
        if (response.ok) {
            window.location.href = '/'; // Redirect to app on success
        } else {
            errorMsg.textContent = data.error || 'Registration failed';
            errorMsg.style.display = 'block';
        }
    } catch (err) {
        errorMsg.textContent = 'Network error occurred';
        errorMsg.style.display = 'block';
    } finally {
        btn.textContent = 'Create Account';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
